esphome:
  name: nosclock
  friendly_name: NosClock
  on_boot:
    - priority: 600
      then:
        - ds1307.read_time: rtc_time
        - logger.log: "Read RTC time"


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/hulakov/NosClock
      ref: master
      path: esphome/components
    components: [nosclock]
  # - source:
  #     type: local
  #     path: components

nosclock:
  id: nosclock_controller
  i2c_id: bus_i2c
  time_id: rtc_time
  tubes_light: tubes_light
  backlight_strip: backlight_strip
  tubes_en: tubes_en
  update_interval: 20ms

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret nosclock_api_key

ota:
  - platform: esphome
    password: !secret nosclock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "NosClock Fallback Hotspot"
    password: !secret nosclock_ap_password

captive_portal:

web_server:
  port: 80


i2c:
  sda:
    number: GPIO8
    ignore_strapping_warning: true
  scl:
    number: GPIO9
    ignore_strapping_warning: true
  id: bus_i2c

time:
  - platform: ds1307
    id: rtc_time
    update_interval: never
  - platform: sntp
    id: sntp_server
    timezone: "Europe/Kiev"
    servers:
      - "pool.ntp.org"
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time
        - logger.log: "NTP -> RTC Sync Completed"
    update_interval: 1h

one_wire:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO10
    id: tubes_en
    frequency: 1000Hz

  - platform: template
    id: virtual_tubes_out
    type: float
    write_action:
      - lambda: ""

light:
  - platform: monochromatic
    name: "Tubes"
    id: tubes_light
    output: virtual_tubes_out
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  - platform: esp32_rmt_led_strip
    pin: GPIO20
    num_leds: 12
    name: "Backlight"
    id: backlight_strip
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    gamma_correct: 0.0
    effects:
      # Solid backlight color with dots blinking every second
      - addressable_lambda:
          name: "Solid"
          lambda: ""
      # Completely static backlight and dots without blinking
      - addressable_lambda:
          name: "Static"
          lambda: ""
      # Backlight color synchronized with time digits using a palette (dots blink)
      - addressable_lambda:
          name: "DigitSync"
          lambda: ""
      # Sequential scanner animation travelling across all digits and dots
      - addressable_lambda:
          name: "Scanner"
          lambda: ""
      # Dual scanner animation travelling across pairs of digits and dots
      - addressable_lambda:
          name: "ScannerDual"
          lambda: ""
      # Circular split scanner animation running in a loop across top and bottom LEDs
      - addressable_lambda:
          name: "ScannerSplit"
          lambda: ""
      # Solid backlight with both backlight and dots blinking every second
      - addressable_lambda:
          name: "Cycle"
          lambda: ""


sensor:
  - platform: scd4x
    address: 0x62
    co2:
      name: "CO2"
      id: co2_sensor
      accuracy_decimals: 0
    temperature:
      name: "Ambient Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Ambient Humidity"
      accuracy_decimals: 1
    update_interval: 60s
    automatic_self_calibration: true
    altitude_compensation: 180m

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "Multi-Button"
    id: clock_button
    on_press:
      - lambda: |-
          nosclock_controller->toggle_clock();

  - platform: template
    name: "High CO2 Alert"
    id: high_co2_alert
    device_class: gas
    lambda: |-
      if (std::isnan(id(co2_sensor).state)) {
        return {}; // Unknown state if sensor is warming up
      }
      if (id(co2_sensor).state >= 1500) {
        return true;  // Threshold exceeded - trigger alert
      }
      if (id(co2_sensor).state <= 1400) {
        return false; // Air quality normal - clear alert
      }
      return id(high_co2_alert).state; // Hysteresis window (1400-1500 ppm) - retain previous state