esphome:
  name: nosclock
  friendly_name: NosClock
  on_boot:
    - priority: 600
      then:
        - ds1307.read_time: rtc_time
        - logger.log: "Read RTC time"
        - lambda: |-
            nosclock_controller->setup_hardware(id(bus_i2c));
            ESP_LOGI("main", "AW9523 and Shift Registers Initialized");
    - priority: -100
      then:
        - lambda: |-
            id(backlight_strip).make_call().set_effect("NosClock").perform();
            // Align backlight and dots state with clock enabled state after components have restored their states
            if (id(tubes_light)->remote_values.is_on()) {
              id(backlight_strip).make_call().set_state(true).perform();
              id(dots_light).make_call().set_state(true).perform();
            } else {
              id(backlight_strip).make_call().set_state(false).perform();
              id(dots_light).make_call().set_state(false).perform();
            }

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

nosclock:
  id: nosclock_controller

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret nosclock_api_key

ota:
  - platform: esphome
    password: !secret nosclock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "NosClock Fallback Hotspot"
    password: !secret nosclock_ap_password

captive_portal:

web_server:
  port: 80


i2c:
  sda:
    number: GPIO8
    ignore_strapping_warning: true
  scl:
    number: GPIO9
    ignore_strapping_warning: true
  id: bus_i2c

time:
  - platform: ds1307
    id: rtc_time
    update_interval: never
  - platform: sntp
    id: sntp_server
    timezone: "Europe/Kiev"
    servers:
      - "pool.ntp.org"
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time
        - logger.log: "NTP -> RTC Sync Completed"
    update_interval: 1h

one_wire:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO10
    id: tubes_en
    frequency: 1000Hz

  - platform: template
    id: virtual_tubes_out
    type: float
    write_action:
      - lambda: ""

  - platform: template
    id: dots_color_red
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: dots_color_green
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: dots_color_blue
    type: float
    write_action:
      - lambda: ""

light:
  - platform: monochromatic
    name: "Tubes"
    id: tubes_light
    output: virtual_tubes_out
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

  - platform: esp32_rmt_led_strip
    pin: GPIO20
    num_leds: 12
    name: "Backlight"
    id: backlight_strip
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - addressable_lambda:
          name: "NosClock"
          update_interval: 1000s
          lambda: ""

  - platform: rgb
    name: "Dots"
    id: dots_light
    red: dots_color_red
    green: dots_color_green
    blue: dots_color_blue
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON


sensor:
  - platform: dallas_temp
    name: "Temperature"
    update_interval: 60s

  - platform: scd4x
    address: 0x62
    co2:
      name: "CO2"
      id: co2_sensor
      accuracy_decimals: 0
    temperature:
      name: "Ambient Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Ambient Humidity"
      accuracy_decimals: 1
    update_interval: 60s
    automatic_self_calibration: true
    altitude_compensation: 180m

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "Multi-Button"
    id: clock_button
    on_press:
      - lambda: |-
          if (id(tubes_light)->remote_values.is_on()) {
            id(tubes_light).make_call().set_state(false).perform();
            id(backlight_strip).make_call().set_state(false).perform();
            id(dots_light).make_call().set_state(false).perform();
          } else {
            id(tubes_light).make_call().set_state(true).perform();
            id(backlight_strip).make_call().set_state(true).perform();
            id(dots_light).make_call().set_state(true).perform();
          }

  - platform: template
    name: "High CO2 Alert"
    id: high_co2_alert
    device_class: gas
    lambda: |-
      if (std::isnan(id(co2_sensor).state)) {
        return {}; // Стан невідомий, якщо датчик ще не прогрівся
      }
      if (id(co2_sensor).state >= 1500) {
        return true;  // Перевищено поріг — вмикаємо алярм
      }
      if (id(co2_sensor).state <= 1400) {
        return false; // Повітря чисте — вимикаємо
      }
      return id(high_co2_alert).state; // В межах 1400-1500 зберігаємо попередній стан

select:
  - platform: template
    name: "Display Effect"
    id: effect_selector
    options:
      - "Solid"
      - "Static"
      - "DigitSync"
      - "Scanner"
      - "ScannerDual"
      - "ScannerSplit"
      - "Cycle"
    initial_option: "Solid"
    optimistic: true
    restore_value: true

interval:
  - interval: 20ms
    then:
      - lambda: |-
          auto time_now = id(rtc_time).now();
          if (time_now.is_valid()) {
            nosclock_controller->update_clock(
              time_now,
              id(tubes_light),
              id(backlight_strip),
              id(dots_light),
              id(tubes_en),
              id(effect_selector).current_option()
            );
          }