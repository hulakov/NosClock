esphome:
  name: nosclock
  friendly_name: NosClock
  on_boot:
    priority: 600
    then:
      - ds1307.read_time: rtc_time
      - logger.log: "Read RTC time"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret nosclock_api_key

ota:
  - platform: esphome
    password: !secret nosclock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  ap:
    ssid: "NosСlock Fallback Hotspot"
    password: !secret wifi_fallback_password

captive_portal:

web_server:
  port: 80

nosclock:
  id: nosclock_logic

i2c:
  sda:
    number: GPIO8
    ignore_strapping_warning: true
  scl:
    number: GPIO9
    ignore_strapping_warning: true

time:
  - platform: ds1307
    id: rtc_time
    update_interval: never
  - platform: sntp
    id: sntp_server
    timezone: "Europe/Kiev"
    servers:
      - "pool.ntp.org"
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time
        - logger.log: "NTP -> RTC Sync Completed"
    update_interval: 1h

one_wire:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true

sensor:
  - platform: dallas_temp
    name: "Temperature"
    update_interval: 60s

  - platform: scd4x
    address: 0x62
    co2:
      name: "CO2"
      id: co2_sensor
      accuracy_decimals: 0
      # on_value:
      #   then:
      #     - lambda: |-
      #         if (x > 1500) {
      #           ESP_LOGW("scd41", "High CO2 level detected: %.1f ppm", x);
      #         }
    temperature:
      name: "Ambient Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Ambient Humidity"
      accuracy_decimals: 1

    update_interval: 60s
    automatic_self_calibration: true
    altitude_compensation: 180m

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO20
      mode: INPUT_PULLUP
      inverted: true
    name: "Multi-Button"
    id: clock_button
    on_multi_click:
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              auto call = id(effect_selector).make_call();
              call.select_next(true);
              call.perform();
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.3s
          - ON for at most 0.5s
        then:
          - lambda: |-
              auto call = id(color_selector).make_call();
              call.select_next(true);
              call.perform();
      - timing:
          - ON for at least 1.0s
        then:
          - switch.toggle: clock_enabled_switch
  - platform: template
    name: "High CO2 Alert"
    id: high_co2_alert
    device_class: gas
    lambda: |-
      if (std::isnan(id(co2_sensor).state)) {
        return {}; // Стан невідомий, якщо датчик ще не прогрівся
      }
      if (id(co2_sensor).state >= 1500) {
        return true;  // Перевищено поріг — вмикаємо алярм
      }
      if (id(co2_sensor).state <= 1400) {
        return false; // Повітря чисте — вимикаємо
      }
      return id(high_co2_alert).state; // В межах 1400-1500 зберігаємо попередній стан

number:
  - platform: template
    name: "Tubes Brightness"
    id: tubes_brightness
    min_value: 10
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(nosclock_logic).set_brightness(x);
    set_action:
      then:
        - lambda: |-
            id(nosclock_logic)->set_brightness(x);
  - platform: template
    name: "Effect Brightness"
    id: effect_brightness
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(nosclock_logic).set_effect_brightness(x);
    set_action:
      then:
        - lambda: |-
            id(nosclock_logic)->set_effect_brightness(x);

globals:
  - id: current_nos_color
    type: CRGB
    restore_value: yes
    initial_value: 'CRGB::Blue'

select:
  - platform: template
    name: "Display Effect"
    id: effect_selector
    options:
      - "Empty"
      - "Solid"
      - "Aurora"
      - "DigitSync"
      - "Scanner"
      - "ProgressBar"
    initial_option: "DigitSync"
    optimistic: true
    set_action:
      then:
        - lambda: |-
            // Declare enum variable first
            NosClockEffect target_effect = NosClockEffect::DigitSync;

            // Populate enum based on string input
            if (x == "Empty") target_effect = NosClockEffect::Empty;
            else if (x == "Solid") target_effect = NosClockEffect::Solid;
            else if (x == "Aurora") target_effect = NosClockEffect::Aurora;
            else if (x == "DigitSync") target_effect = NosClockEffect::DigitSync;
            else if (x == "Scanner") target_effect = NosClockEffect::Scanner;
            else if (x == "ProgressBar") target_effect = NosClockEffect::ProgressBar;

            id(nosclock_logic)->set_effect(target_effect, id(current_nos_color));

  - platform: template
    name: "Display Color"
    id: color_selector
    options:
      - "Red"
      - "Green"
      - "Blue"
      - "Yellow"
      - "Cyan"
      - "Magenta"
      - "White"
    initial_option: "Blue"
    optimistic: true
    set_action:
      then:
        - lambda: |-
            // Update global color variable based on selection
            if (x == "Red") id(current_nos_color) = CRGB::Red;
            else if (x == "Green") id(current_nos_color) = CRGB::Green;
            else if (x == "Blue") id(current_nos_color) = CRGB::Blue;
            else if (x == "Yellow") id(current_nos_color) = CRGB::Yellow;
            else if (x == "Cyan") id(current_nos_color) = CRGB::Cyan;
            else if (x == "Magenta") id(current_nos_color) = CRGB::Magenta;
            else if (x == "White") id(current_nos_color) = CRGB::White;

            id(nosclock_logic)->set_effect(id(nosclock_logic)->get_effect(), id(current_nos_color));

switch:
  - platform: template
    name: "Enabled"
    id: clock_enabled_switch
    icon: "mdi:power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      then:
        - lambda: "id(nosclock_logic)->set_enabled(true);"
    turn_off_action:
      then:
        - lambda: "id(nosclock_logic)->set_enabled(false);"